name: Release APK (Obtainium)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (z.B. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}" || git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout FETCH_HEAD

      - name: Configure JDK 21 and Gradle 9.3.1
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -d "${JAVA_HOME_21_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
            export JAVA_HOME="${JAVA_HOME_21_X64}"
            export PATH="${JAVA_HOME_21_X64}/bin:${PATH}"
          fi
          java -version

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/.gradle-dist/gradle-${GRADLE_VERSION}"
          if [ ! -x "${GRADLE_DIR}/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle-dist"
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q -o /tmp/gradle.zip -d "$HOME/.gradle-dist"
            rm -f /tmp/gradle.zip
          fi
          echo "${GRADLE_DIR}/bin" >> "$GITHUB_PATH"
          "${GRADLE_DIR}/bin/gradle" --version

      - name: Prepare Firebase config and signing keystore
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            gradle :app:assembleRelease --no-parallel --no-configuration-cache
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            gradle :app:assembleDebug --no-parallel --no-configuration-cache
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "${APK_PATH:-}" ] || [ ! -f "$APK_PATH" ]; then
            echo "No APK file found after Gradle build!" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            case "${GITHUB_REF}" in
              refs/tags/*) TAG="${GITHUB_REF_NAME}" ;;
              *) TAG="v1.0.${RUN_NUMBER}" ;;
            esac
          fi

          mkdir -p dist
          cp "$APK_PATH" "dist/PulseChat-${TAG}.apk"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          ls -lh "dist/PulseChat-${TAG}.apk"

      - name: Publish GitHub Release for Obtainium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_FILE="dist/PulseChat-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PulseChat ${RELEASE_TAG}" \
              --generate-notes
          fi
